
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aj-Flip - Created by Ajun Ravi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #050505;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
    }
    #root {
      width: 100%;
      min-height: 100vh;
    }
    .font-serif {
      font-family: 'Playfair+Display', serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .zoom-container {
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center center;
    }

    .paper-grain {
      background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
      pointer-events: none;
    }

    /* Dark Theme Seekbar Customization */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #6366f1; /* Indigo 500 */
      cursor: pointer;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
      border: 2px solid #ffffff;
      margin-top: -6px;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    input[type=range]:hover::-webkit-slider-thumb {
      transform: scale(1.2);
      background: #818cf8; /* Indigo 400 */
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.6);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    /* CRITICAL: Eliminate engine transparency artifacts */
    .stf__parent {
      background-color: transparent !important;
    }
    
    /* We make the library blocks transparent so our custom centering and housing logic works without "ghost" white blocks */
    .stf__item {
      background-color: transparent !important; 
      box-shadow: none !important;
      overflow: hidden !important;
      opacity: 1 !important;
    }

    .stf__block {
      background-color: transparent !important;
      opacity: 1 !important;
    }

    /* Prevent sub-pixel bleed */
    .page {
      box-sizing: border-box;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      contain: paint;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@4.0.379",
    "react-pageflip": "https://esm.sh/react-pageflip@2.0.3?external=react,react-dom",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-[#050505] text-stone-100">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
